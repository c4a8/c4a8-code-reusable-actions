name: Generate Epoch Semantic Version

on:
  workflow_call:
    inputs:
      prefix:
        description: "Optional prefix to prepend to generated tags (e.g., module names)"
        required: false
        type: string
        default: ""
      suppress_release:
        description: "If true, skip creating a GitHub release"
        required: false
        type: boolean
        default: false
      is_draft_release:
        description: "If true, create the GitHub release as a draft"
        required: false
        type: boolean
        default: false
      suppress_tag:
        description: "If true, skip creating a Git tag and release"
        required: false
        type: boolean
        default: false
      check_last_commit_only:
        description: "If true, only inspect the most recent commit when determining bump type"
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: "If true, generate a prerelease version"
        required: false
        type: boolean
        default: false
      prerelease_name:
        description: "Name for prerelease identifier. If not set it keeps plain epoch semver versions and active prerelease state."
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Calculated epoch semantic version (year.week.patch)"
        value: ${{ jobs.bump.outputs.version }}
      tag:
        description: "Created tag name"
        value: ${{ jobs.bump.outputs.tag }}
      bump_type:
        description: "Type of bump applied (release, patch)"
        value: ${{ jobs.bump.outputs.bump_type }}
      previous_tag:
        description: "Most recent tag prior to calculation (if any)"
        value: ${{ jobs.bump.outputs.previous_tag }}
      commit_subject:
        description: "Commit subject that drove the bump decision"
        value: ${{ jobs.bump.outputs.commit_subject }}
      release_id:
        description: "Numeric ID of the created/existing GitHub release. Empty when release creation is suppressed."
        value: ${{ jobs.bump.outputs.release_id }}

jobs:
  bump:
    name: Determine version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.epoch-semantic-version.outputs.version }}
      tag: ${{ steps.epoch-semantic-version.outputs.tag }}
      bump_type: ${{ steps.epoch-semantic-version.outputs.bump_type }}
      previous_tag: ${{ steps.epoch-semantic-version.outputs.previous_tag }}
      commit_subject: ${{ steps.epoch-semantic-version.outputs.commit_subject }}
      release_id: ${{ steps.epoch-semantic-version.outputs.release_id }}
    steps:
      - name: Show deprecation warning
        run: 'echo "::warning::This reusable workflow is deprecated and will be deactivated on 01.01.2027. Please migrate to the specialized glueckkanja action: https://github.com/glueckkanja/action-epoch-semantic-version"'
      - name: Generate Epoch Semantic Version
        id: epoch-semantic-version
        uses: glueckkanja/action-epoch-semantic-version@f1eb38a96b44a2a9ce4378257afceed2babcc6e1 # v2.1.1
        with:
          prefix: ${{ inputs.prefix }}
          suppress_release: ${{ inputs.suppress_release }}
          is_draft_release: ${{ inputs.is_draft_release }}
          suppress_tag: ${{ inputs.suppress_tag }}
          check_last_commit_only: ${{ inputs.check_last_commit_only }}
          is_prerelease: ${{ inputs.is_prerelease }}
          prerelease_name: ${{ inputs.prerelease_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
