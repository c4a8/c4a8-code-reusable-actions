name: Deploy Azure Function

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: "Version of .NET SDK to use (e.g., '10.x')"
        type: string
        required: true
      tenant_id:
        description: "Azure Tenant ID"
        type: string
        required: true
      subscription_id:
        description: "Azure Subscription ID"
        type: string
        required: true
      client_id:
        description: "Azure Client ID"
        type: string
        required: true
      function_app_name:
        description: "Name of the Azure Function App to deploy"
        type: string
        required: true
      environment:
        description: "Deployment environment (e.g., 'staging', 'production')"
        type: string
        default: "production"
        required: false
      funcignore:
        description: "Respect the .funcignore file during deployment"
        type: boolean
        default: false
        required: false
      nuget_source_name:
        description: "Name of the NuGet package source (used in NuGetPackageSourceCredentials_{name}). Leave empty to skip NuGet authentication."
        type: string
        required: false
        default: ""
      project_path:
        description: "Relative path to the .csproj file to build and publish"
        type: string
        required: true
    secrets:
      github_pat:
        description: "GitHub Personal Access Token. Use GitHubs standard secret GITHUB_TOKEN here. Required when nuget_source_name is set."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    environment: ${{ inputs.environment }}

    steps:
      - name: Show deprecation warning
        run: 'echo "::warning::This reusable workflow is deprecated and will be deactivated on 01.01.2027. Please migrate to the specialized glueckkanja action: https://github.com/glueckkanja/action-deploy-azure-function"'
      - name: Deploy Azure Function
        uses: glueckkanja/action-deploy-azure-function@eed04a1217026b4cacbad49be05ee6b6ee040d57 # v2.0.1
        with:
          dotnet_version: ${{ inputs.dotnet_version }}
          tenant_id: ${{ inputs.tenant_id }}
          subscription_id: ${{ inputs.subscription_id }}
          client_id: ${{ inputs.client_id }}
          function_app_name: ${{ inputs.function_app_name }}
          environment: ${{ inputs.environment }}
          funcignore: ${{ inputs.funcignore }}
          nuget_source_name: ${{ inputs.nuget_source_name }}
          github_pat: ${{ secrets.github_pat }}
          project_path: ${{ inputs.project_path }}
