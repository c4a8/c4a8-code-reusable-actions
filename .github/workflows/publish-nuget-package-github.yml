name: Publish NuGet Package

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: "Version of .NET SDK to use (e.g., '10.x')"
        type: string
        required: true
      project_path:
        description: "Path to the .NET project file (e.g., 'project/project.csproj')"
        type: string
        required: true
      package_output:
        description: "Output directory for the NuGet package (e.g., 'project/bin/Release')"
        type: string
        required: true
      package_version:
        description: "Version of the NuGet package to publish (e.g., '1.0.0')"
        type: string
        required: true
      assembly_version:
        description: "(Optional) Set specific assembly version (e.g., '1.0.0'). If not set, it will default to package version."
        type: string
    secrets:
      github_pat:
        description: "GitHub Personal Access Token with 'write:packages' scope"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Show deprecation warning
        run: 'echo "::warning::This reusable workflow is deprecated and will be deactivated on 01.01.2027. Please migrate to the specialized glueckkanja action: https://github.com/glueckkanja/action-publish-nuget-package"'
      - name: Publish NuGet Package
        uses: glueckkanja/action-publish-nuget-package@329d8bb522f11c3059ba8425273ea3b59133203f # v2.0.0
        with:
          dotnet_version: ${{ inputs.dotnet_version }}
          project_path: ${{ inputs.project_path }}
          package_output: ${{ inputs.package_output }}
          package_version: ${{ inputs.package_version }}
          assembly_version: ${{ inputs.assembly_version }}
          github_pat: ${{ secrets.github_pat }}
